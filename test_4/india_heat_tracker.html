<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>India City Heat Tracker - Professional</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    :root {
      --header-1: #dc2626;
      --header-2: #991b1b;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: var(--text); }

    header {
      background: linear-gradient(135deg, var(--header-1), var(--header-2));
      color: #fff;
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }
    .header-title { font-size: 28px; font-weight: 800; margin: 0; }
    .header-sub { margin-top: 6px; font-size: 13px; opacity: 0.9; }

    .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr 480px;
      gap: 20px;
      padding: 20px;
      min-height: calc(100vh - 100px);
    }

    .panel {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid #f0f0f0;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fafafa, #f5f5f5);
    }
    .panel-title { margin: 0; font-size: 16px; font-weight: 800; }
    .panel-sub { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .panel-body { padding: 16px; }

    /* Date Filter */
    .date-range { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .date-input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; }
    .apply-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--header-1), var(--header-2));
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .apply-button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(220, 38, 38, 0.3); }

    .reset-button { width: 100%; padding: 10px; background: #f3f4f6; color: #374151; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 12px; }
    .reset-button:hover { background: #e5e7eb; }

    /* Search */
    .search-box { position: relative; margin-bottom: 16px; }
    .search-input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
    .search-input:focus { outline: none; border-color: var(--header-1); }

    #cityList {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--line);
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .city-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .city-item:hover { background: #f9fafb; }

    /* Map */
    #mapWrap { height: 500px; background: linear-gradient(180deg, #f0f9ff, #e0f2fe); position: relative; }
    #map { width: 100%; height: 100%; }

    .city-circle { stroke: white; stroke-width: 2px; cursor: pointer; }
    .city-circle:hover { stroke-width: 3px; }
    .city-circle.selected { stroke: #000; stroke-width: 3px; }

    .tooltip { position: absolute; opacity: 0; pointer-events: none; background: rgba(0,0,0,0.9); color: white; padding: 8px 12px; border-radius: 6px; font-size: 11px; z-index: 1000; }

    /* City Card */
    .city-card-header { margin-bottom: 20px; }
    .city-name { font-size: 24px; font-weight: 800; margin: 0; }
    .city-state { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .fact-box {
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .fact-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .fact-value { font-size: 20px; font-weight: 800; color: var(--text); }

    .chart-section { margin-bottom: 20px; }
    .chart-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--text); text-transform: uppercase; }
    .chart-svg { width: 100%; height: 180px; }

    /* Bottom Section */
    .records-section {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .records-title { font-size: 18px; font-weight: 800; margin: 0 0 16px 0; }

    .records-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .city-card {
      background: linear-gradient(135deg, #fafafa, #f5f5f5);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      transition: 0.2s;
    }
    .city-card:hover {
      border-color: var(--header-1);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
    }

    .card-city-name { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
    .card-city-state { font-size: 11px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }

    .card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .card-metric-item {
      background: white;
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid #dc2626;
    }
    .card-metric-item.min { border-left-color: #3b82f6; }
    .card-metric-item.anomaly { border-left-color: #f97316; }

    .card-metric-label { font-size: 9px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
    .card-metric-value { font-size: 14px; font-weight: 800; color: var(--text); }

    .card-stats { font-size: 11px; color: #555; line-height: 1.6; background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .card-stats strong { color: var(--text); font-weight: 700; }

    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .error { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; }

    @media (max-width: 1400px) {
      .dashboard { grid-template-columns: 300px 1fr 380px; }
    }

    @media (max-width: 1100px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 4px; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🌡️ India City Heat Tracker</div>
    <div class="header-sub">Comprehensive temperature analysis across India's major cities</div>
  </header>

  <div class="dashboard">
    <!-- LEFT SIDEBAR -->
    <div>
      <div class="panel">
        <div class="panel-header">
          <p class="panel-title">Search & Filter</p>
          <p class="panel-sub">Select city and date range</p>
        </div>
        <div class="panel-body">
          <label>Date Range Filter</label>
          <div class="date-range">
            <div>
              <label style="margin-bottom: 4px;">From</label>
              <input type="date" id="dateStart" class="date-input" />
            </div>
            <div>
              <label style="margin-bottom: 4px;">To</label>
              <input type="date" id="dateEnd" class="date-input" />
            </div>
          </div>
          <button class="apply-button" onclick="applyDateFilter()">📅 Apply Filter</button>
          <button class="reset-button" onclick="resetDateFilter()">↺ Show All</button>

          <div class="search-box" style="margin-top: 16px;">
            <input type="text" id="citySearch" class="search-input" placeholder="Search city..." />
            <div id="cityList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER: MAP -->
    <div>
      <div class="panel" style="height: 100%; display: flex; flex-direction: column;">
        <div class="panel-header">
          <p class="panel-title">India Temperature Map</p>
          <p class="panel-sub">Click any city to view details</p>
        </div>
        <div id="mapWrap" style="flex: 1;">
          <svg id="map"></svg>
        </div>
      </div>
    </div>

    <!-- RIGHT: CITY CARD -->
    <div>
      <div class="panel">
        <div class="panel-body" id="cityCard">
          <div class="loading">Select a city from the map</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM: ALL CITIES RECORDS -->
  <div class="records-section" id="recordsSection" style="display: none;">
    <h2 class="records-title">📊 City Temperature Summary</h2>
    <div class="records-grid" id="recordsGrid"></div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    let allData = [];
    let citiesMetadata = {};
    let dataByCity = {};
    let selectedCity = null;
    let dateFilter = { applied: false, start: null, end: null };

    function getTemperatureColor(temp) {
      if (temp < 20) return '#3b82f6';
      if (temp < 25) return '#06b6d4';
      if (temp < 30) return '#f59e0b';
      if (temp < 35) return '#f97316';
      if (temp < 40) return '#dc2626';
      return '#7f1d1d';
    }

    async function loadData() {
      try {
        const tempRes = await fetch('india_city_temperature.csv');
        const tempText = await tempRes.text();
        const tempData = d3.csvParse(tempText, d => ({
          date: d.date,
          city: d.city,
          tmax: +d.tmax,
          tmin: +d.tmin,
          tmax_normal: d.tmax_normal ? +d.tmax_normal : null,
          tmin_normal: d.tmin_normal ? +d.tmin_normal : null,
          tmax_anomaly: d.tmax_anomaly ? +d.tmax_anomaly : null,
          tmin_anomaly: d.tmin_anomaly ? +d.tmin_anomaly : null
        }));

        const metaRes = await fetch('india_cities_metadata.csv');
        const metaText = await metaRes.text();
        const metaData = d3.csvParse(metaText);

        metaData.forEach(d => {
          citiesMetadata[d.city] = {
            latitude: +d.latitude,
            longitude: +d.longitude,
            state: d.state,
            latestDate: d.latest_date,
            avgTmax: +d.avg_tmax,
            avgTmin: +d.avg_tmin,
            recordCount: +d.record_count
          };
        });

        tempData.forEach(d => {
          if (!dataByCity[d.city]) dataByCity[d.city] = [];
          dataByCity[d.city].push(d);
        });

        Object.keys(dataByCity).forEach(city => {
          dataByCity[city].sort((a, b) => new Date(a.date) - new Date(b.date));
        });

        allData = tempData;
        initUI();
        renderMap();
        showAllRecords();
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function initUI() {
      const search = document.getElementById('citySearch');
      const list = document.getElementById('cityList');

      search.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const cities = Object.keys(citiesMetadata).sort();
        const filtered = cities.filter(c => c.toLowerCase().includes(query));

        if (query.length === 0 || filtered.length === 0) {
          list.style.display = 'none';
          return;
        }

        list.innerHTML = filtered.map(c => `<div class="city-item" onclick="selectCity('${c}')">${c}</div>`).join('');
        list.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (e.target !== search) list.style.display = 'none';
      });

      setDefaultDateRange();
    }

    function setDefaultDateRange() {
      const today = new Date();
      const oneYearAgo = new Date(today.getTime() - 365 * 24 * 60 * 60 * 1000);
      document.getElementById('dateStart').value = formatDate(oneYearAgo);
      document.getElementById('dateEnd').value = formatDate(today);
    }

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    function applyDateFilter() {
      const start = document.getElementById('dateStart').value;
      const end = document.getElementById('dateEnd').value;
      if (!start || !end) { alert('Select both dates'); return; }
      dateFilter.start = new Date(start);
      dateFilter.end = new Date(end);
      dateFilter.applied = true;
      if (selectedCity) renderCityCard();
      showAllRecords();
    }

    function resetDateFilter() {
      dateFilter.applied = false;
      dateFilter.start = null;
      dateFilter.end = null;
      document.getElementById('dateStart').value = '';
      document.getElementById('dateEnd').value = '';
      setDefaultDateRange();
      if (selectedCity) renderCityCard();
      showAllRecords();
    }

    function selectCity(city) {
      selectedCity = city;
      document.getElementById('citySearch').value = city;
      document.getElementById('cityList').style.display = 'none';
      renderCityCard();
      renderMap();
      showAllRecords();
    }

    function renderMap() {
      const svg = d3.select('#map');
      const rect = svg.node().getBoundingClientRect();
      const width = Math.max(rect.width, 600);
      const height = Math.max(rect.height, 400);

      svg.attr('viewBox', `0 0 ${width} ${height}`);

      const xScale = d3.scaleLinear().domain([68, 97]).range([60, width - 60]);
      const yScale = d3.scaleLinear().domain([8, 35]).range([height - 60, 60]);

      svg.selectAll('.city-circle').remove();

      Object.entries(citiesMetadata).forEach(([city, meta]) => {
        if (!meta.latitude || !meta.longitude) return;

        const cityData = dataByCity[city] || [];
        let latestTemp = 25;
        if (cityData.length > 0) {
          let filtered = cityData;
          if (dateFilter.applied && dateFilter.start && dateFilter.end) {
            filtered = cityData.filter(d => {
              const dDate = new Date(d.date);
              return dDate >= dateFilter.start && dDate <= dateFilter.end;
            });
          }
          if (filtered.length > 0) latestTemp = filtered[filtered.length - 1].tmax;
        }

        const color = getTemperatureColor(latestTemp);
        const size = Math.max(5, Math.min(14, 5 + (latestTemp - 20) / 3));

        svg.append('circle')
          .attr('class', `city-circle ${city === selectedCity ? 'selected' : ''}`)
          .attr('cx', xScale(meta.longitude))
          .attr('cy', yScale(meta.latitude))
          .attr('r', size)
          .attr('fill', color)
          .attr('opacity', 0.85)
          .on('click', () => selectCity(city))
          .on('mousemove', function(event) {
            d3.select('#tooltip').style('opacity', 1)
              .html(`<strong>${city}</strong><br>${meta.state}<br>Max: ${latestTemp.toFixed(1)}°C`)
              .style('left', (event.pageX + 10) + 'px')
              .style('top', (event.pageY - 20) + 'px');
          })
          .on('mouseout', () => d3.select('#tooltip').style('opacity', 0));
      });
    }

    function renderCityCard() {
      const card = document.getElementById('cityCard');

      if (!selectedCity || !dataByCity[selectedCity]) {
        card.innerHTML = '<div class="loading">Select a city</div>';
        return;
      }

      let data = dataByCity[selectedCity];

      if (dateFilter.applied && dateFilter.start && dateFilter.end) {
        data = data.filter(d => {
          const dDate = new Date(d.date);
          return dDate >= dateFilter.start && dDate <= dateFilter.end;
        });
      }

      if (data.length === 0) {
        card.innerHTML = '<div class="error">No data for selected period</div>';
        return;
      }

      const meta = citiesMetadata[selectedCity];
      const latest = data[data.length - 1];
      const avgTmax = d3.mean(data, d => d.tmax);
      const avgTmin = d3.mean(data, d => d.tmin);
      const avgTmaxAnomaly = d3.mean(data, d => d.tmax_anomaly || 0);
      const avgTminAnomaly = d3.mean(data, d => d.tmin_anomaly || 0);
      const daysAboveMaxNorm = data.filter(d => d.tmax_anomaly && d.tmax_anomaly > 0).length;
      const daysBelowMaxNorm = data.filter(d => d.tmax_anomaly && d.tmax_anomaly < 0).length;
      const daysAboveMinNorm = data.filter(d => d.tmin_anomaly && d.tmin_anomaly > 0).length;
      const daysBelowMinNorm = data.filter(d => d.tmin_anomaly && d.tmin_anomaly < 0).length;

      card.innerHTML = `
        <div class="city-card-header">
          <div class="city-name">${selectedCity}</div>
          <div class="city-state">📍 ${meta.state}</div>
        </div>

        <div class="facts-grid">
          <div class="fact-box">
            <div class="fact-label">Total Days Tracked</div>
            <div class="fact-value">${data.length}</div>
          </div>
          <div class="fact-box">
            <div class="fact-label">Latest Max Temp</div>
            <div class="fact-value" style="color: ${getTemperatureColor(latest.tmax)};">${latest.tmax.toFixed(1)}°C</div>
          </div>
          <div class="fact-box">
            <div class="fact-label">Avg Max Temp</div>
            <div class="fact-value" style="color: ${getTemperatureColor(avgTmax)};">${avgTmax.toFixed(1)}°C</div>
          </div>
          <div class="fact-box">
            <div class="fact-label">Avg Min Temp</div>
            <div class="fact-value" style="color: #3b82f6;">${avgTmin.toFixed(1)}°C</div>
          </div>
          <div class="fact-box">
            <div class="fact-label">Avg Max Anomaly</div>
            <div class="fact-value" style="color: ${avgTmaxAnomaly > 0 ? '#dc2626' : '#3b82f6'};">${avgTmaxAnomaly > 0 ? '+' : ''}${avgTmaxAnomaly.toFixed(1)}°C</div>
          </div>
          <div class="fact-box">
            <div class="fact-label">Avg Min Anomaly</div>
            <div class="fact-value" style="color: ${avgTminAnomaly > 0 ? '#dc2626' : '#3b82f6'};">${avgTminAnomaly > 0 ? '+' : ''}${avgTminAnomaly.toFixed(1)}°C</div>
          </div>
        </div>

        <div class="chart-section">
          <div class="chart-title">🔴 Max Temperature (Actual, Normal & Anomaly)</div>
          <svg class="chart-svg" id="tmaxChart"></svg>
        </div>

        <div class="chart-section">
          <div class="chart-title">🔵 Min Temperature (Actual, Normal & Anomaly)</div>
          <svg class="chart-svg" id="tminChart"></svg>
        </div>

        <div style="background: #f9fafb; padding: 12px; border-radius: 8px; font-size: 12px; line-height: 1.6; color: #555;">
          <strong style="color: var(--text);">📊 Additional Facts:</strong><br>
          Days above normal (Max): ${daysAboveMaxNorm}/${data.length}<br>
          Days below normal (Max): ${daysBelowMaxNorm}/${data.length}<br>
          Days above normal (Min): ${daysAboveMinNorm}/${data.length}<br>
          Days below normal (Min): ${daysBelowMinNorm}/${data.length}
        </div>
      `;

      setTimeout(() => {
        renderDualChart('#tmaxChart', data, 'tmax', 'tmax_normal', 'tmax_anomaly', '#dc2626', '#3b82f6');
        renderDualChart('#tminChart', data, 'tmin', 'tmin_normal', 'tmin_anomaly', '#3b82f6', '#dc2626');
      }, 100);
    }

    function renderDualChart(selector, data, key, normalKey, anomalyKey, color1, color2) {
      const svg = d3.select(selector);
      const margin = { top: 10, right: 20, bottom: 20, left: 40 };
      const width = svg.node().clientWidth;
      const height = 180;
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      svg.selectAll('*').remove();
      svg.attr('width', width).attr('height', height);

      // Prepare 3 lines data
      const recentData = data.slice(-30);

      const xScale = d3.scaleLinear().domain([0, recentData.length - 1]).range([0, innerWidth]);
      
      const allVals = [];
      recentData.forEach(d => {
        allVals.push(d[key]);
        allVals.push(d[normalKey] || 0);
        allVals.push(d[anomalyKey] || 0);
      });

      const yScale = d3.scaleLinear()
        .domain([Math.min(...allVals) - 2, Math.max(...allVals) + 2])
        .range([innerHeight, 0]);

      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      // Grid
      g.append('g').attr('opacity', 0.1).call(d3.axisLeft(yScale).tickSize(-innerWidth).tickFormat(''));

      // Normal line (dashed)
      g.append('path')
        .attr('stroke', '#cbd5e1')
        .attr('stroke-width', 1.5)
        .attr('stroke-dasharray', '5,3')
        .attr('fill', 'none')
        .attr('d', d3.line()
          .x((d, i) => xScale(i))
          .y(d => yScale(d[normalKey]))
          (recentData)
        );

      // Actual line
      g.append('path')
        .attr('stroke', color1)
        .attr('stroke-width', 2.5)
        .attr('fill', 'none')
        .attr('d', d3.line()
          .x((d, i) => xScale(i))
          .y(d => yScale(d[key]))
          (recentData)
        );

      // Anomaly line
      g.append('path')
        .attr('stroke', color2)
        .attr('stroke-width', 2)
        .attr('fill', 'none')
        .attr('stroke-dasharray', '3,3')
        .attr('d', d3.line()
          .x((d, i) => xScale(i))
          .y(d => yScale(d[anomalyKey]))
          (recentData)
        );

      // Points for actual
      g.selectAll('circle.actual')
        .data(recentData)
        .enter()
        .append('circle')
        .attr('class', 'actual')
        .attr('cx', (d, i) => xScale(i))
        .attr('cy', d => yScale(d[key]))
        .attr('r', 2.5)
        .attr('fill', color1)
        .attr('opacity', 0.7)
        .on('mousemove', function(event, d) {
          d3.select('#tooltip').style('opacity', 1)
            .html(`Date: ${d.date}<br>Actual: ${d[key].toFixed(1)}°C<br>Normal: ${(d[normalKey] || 0).toFixed(1)}°C<br>Anomaly: ${(d[anomalyKey] || 0).toFixed(2)}°C`)
            .style('left', (event.pageX + 10) + 'px')
            .style('top', (event.pageY - 30) + 'px');
        })
        .on('mouseout', () => d3.select('#tooltip').style('opacity', 0));

      // Axes
      g.append('g').attr('transform', `translate(0,${innerHeight})`).call(d3.axisBottom(xScale).tickFormat(''));
      g.append('g').call(d3.axisLeft(yScale).ticks(3));
    }

    function showAllRecords() {
      const grid = document.getElementById('recordsGrid');
      const section = document.getElementById('recordsSection');

      // Get latest record for each city
      const cityRecords = {};

      Object.entries(dataByCity).forEach(([city, data]) => {
        let filtered = data;
        if (dateFilter.applied && dateFilter.start && dateFilter.end) {
          filtered = data.filter(d => {
            const dDate = new Date(d.date);
            return dDate >= dateFilter.start && dDate <= dateFilter.end;
          });
        }

        if (filtered.length === 0) return;

        const meta = citiesMetadata[city];
        const latest = filtered[filtered.length - 1];
        const avgTmax = d3.mean(filtered, d => d.tmax);
        const avgTmin = d3.mean(filtered, d => d.tmin);
        const avgTmaxAnomaly = d3.mean(filtered, d => d.tmax_anomaly || 0);
        const avgTminAnomaly = d3.mean(filtered, d => d.tmin_anomaly || 0);
        const daysAboveMax = filtered.filter(d => d.tmax_anomaly && d.tmax_anomaly > 0).length;
        const daysBelowMax = filtered.filter(d => d.tmax_anomaly && d.tmax_anomaly < 0).length;
        const daysAboveMin = filtered.filter(d => d.tmin_anomaly && d.tmin_anomaly > 0).length;
        const daysBelowMin = filtered.filter(d => d.tmin_anomaly && d.tmin_anomaly < 0).length;

        cityRecords[city] = { meta, latest, avgTmax, avgTmin, avgTmaxAnomaly, avgTminAnomaly, daysAboveMax, daysBelowMax, daysAboveMin, daysBelowMin, count: filtered.length };
      });

      const sortedCities = Object.entries(cityRecords).sort((a, b) => b[1].latest.tmax - a[1].latest.tmax);

      section.style.display = sortedCities.length > 0 ? 'block' : 'none';

      grid.innerHTML = sortedCities.map(([city, data]) => `
        <div class="city-card">
          <div class="card-city-name">${city}</div>
          <div class="card-city-state">${data.meta.state}</div>

          <div class="card-metrics">
            <div class="card-metric-item">
              <div class="card-metric-label">Latest Max</div>
              <div class="card-metric-value" style="color: ${getTemperatureColor(data.latest.tmax)};">${data.latest.tmax.toFixed(1)}°</div>
            </div>
            <div class="card-metric-item min">
              <div class="card-metric-label">Latest Min</div>
              <div class="card-metric-value">${data.latest.tmin.toFixed(1)}°</div>
            </div>
            <div class="card-metric-item">
              <div class="card-metric-label">Avg Max</div>
              <div class="card-metric-value">${data.avgTmax.toFixed(1)}°</div>
            </div>
            <div class="card-metric-item min">
              <div class="card-metric-label">Avg Min</div>
              <div class="card-metric-value">${data.avgTmin.toFixed(1)}°</div>
            </div>
          </div>

          <div class="card-stats">
            <strong>📊 Details:</strong><br>
            Days Tracked: ${data.count}<br>
            Above Normal (Max): ${data.daysAboveMax}/${data.count}<br>
            Below Normal (Max): ${data.daysBelowMax}/${data.count}<br>
            Above Normal (Min): ${data.daysAboveMin}/${data.count}<br>
            Below Normal (Min): ${data.daysBelowMin}/${data.count}<br>
            <strong>Avg Anomaly:</strong> Max: ${data.avgTmaxAnomaly > 0 ? '+' : ''}${data.avgTmaxAnomaly.toFixed(1)}° | Min: ${data.avgTminAnomaly > 0 ? '+' : ''}${data.avgTminAnomaly.toFixed(1)}°
          </div>
        </div>
      `).join('');
    }

    loadData();
  </script>

</body>
</html>
